# Primary DNS - Mac 1 (10.7.21.158)
listen-address=127.0.0.1,10.7.21.158
bind-interfaces
no-resolv
server=1.1.1.1
server=8.8.8.8
domain-needed
bogus-priv
local=/diddybois.test/
# Records live in a hosts file so Extension B can change them and SIGHUP dnsmasq
addn-hosts=/tmp/cn-run/records.hosts
no-hosts
# Short TTL so caching and cutover behaviour is visible (Extension B)
local-ttl=30
log-queries
log-facility=/tmp/cn-run/dnsmasq.log
pid-file=/tmp/cn-run/dnsmasq.pid

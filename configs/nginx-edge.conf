# Edge reverse proxy + load balancer. Same file runs on the primary edge (Mac 2) and the standby edge (Mac 3).
worker_processes 1;
pid /tmp/cn-run/nginx.pid;
error_log /tmp/cn-run/nginx-error.log info;
events { worker_connections 1024; }
http {
    access_log /tmp/cn-run/nginx-access.log;
    client_body_temp_path /tmp/cn-run/tmp_body;
    proxy_temp_path       /tmp/cn-run/tmp_proxy;
    fastcgi_temp_path     /tmp/cn-run/tmp_fcgi;
    uwsgi_temp_path       /tmp/cn-run/tmp_uwsgi;
    scgi_temp_path        /tmp/cn-run/tmp_scgi;

    upstream team_backends {
        # round-robin (default). A backend that fails once is skipped for 5s (passive health check).
        server 10.7.26.199:3001 max_fails=1 fail_timeout=5s;   # Backend A
        server 10.7.21.79:3002 max_fails=1 fail_timeout=5s;   # Backend B
    }

    server {
        listen 8443 ssl;
        server_name app.diddybois.test api.diddybois.test;
        ssl_certificate     /opt/homebrew/etc/nginx/certs/app.diddybois.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.diddybois.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://team_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Extension D: on error/timeout/5xx from one backend, retry on the other
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            add_header X-Edge $hostname always;   # which edge machine answered (Extension E)
        }
    }
}

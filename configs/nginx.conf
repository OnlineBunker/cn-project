worker_processes 1;
pid /tmp/team_nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/team_nginx_access.log;
    error_log /tmp/team_nginx_error.log;

    upstream team_backends {
        server 10.7.21.102:3001 max_fails=1 fail_timeout=5s;
        server 10.7.17.77:3002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8443 ssl;
        server_name app.diddybois.test api.diddybois.test;

        ssl_certificate /opt/homebrew/etc/nginx/certs/app.diddybois.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.diddybois.test.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://team_backends;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
